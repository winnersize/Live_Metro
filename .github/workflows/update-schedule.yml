name: Update metro schedule

on:
  schedule:
    # Время указано в UTC. Киев летом = UTC+3, зимой = UTC+2.
    # Ниже - запуск примерно в 00:10, 06:10, 12:10, 18:10 по Киеву (летнее время).
    # Зимой реальное время запуска сдвинется на час раньше по Киеву - не критично,
    # т.к. обновление происходит несколько раз в день с запасом.
    - cron: '10 21 * * *'  # 00:10 Киев
    - cron: '10 3 * * *'   # 06:10 Киев
    - cron: '10 9 * * *'   # 12:10 Киев
    - cron: '10 15 * * *'  # 18:10 Киев
  workflow_dispatch: {}   # позволяет запустить вручную кнопкой "Run workflow"

permissions:
  contents: write   # нужно, чтобы workflow мог закоммитить обновлённый JSON обратно в репозиторий

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape_inmetro_schedule.py

      - name: Commit and push if changed
        run: |
          git config user.name "schedule-bot"
          git config user.email "actions@users.noreply.github.com"
          git add schedule_lisova_to_akademmistechko.json
          git diff --staged --quiet || git commit -m "Автообновление расписания"
          git push
